<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Wave</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box;font-family:system-ui,-apple-system,sans-serif}
  body{background:#0a0a0a;color:#fff;min-height:100vh;padding-bottom:120px}
  header{padding:16px;display:flex;justify-content:space-between;align-items:center;position:sticky;top:0;background:#0a0a0a;z-index:10}
  .logo{font-size:28px;font-weight:900;letter-spacing:-1px}
  .logo span{color:#1db954}
  .btn{background:#1db954;border:0;color:#000;font-weight:700;padding:8px 16px;border-radius:999px;cursor:pointer}
  .btn-outline{background:transparent;color:#fff;border:1px solid #333;padding:8px 14px;border-radius:999px;cursor:pointer}
  .search-box{margin:0 16px 16px;display:flex;gap:8px}
  .search-box input{flex:1;background:#1a1a1a;border:1px solid #333;color:#fff;padding:14px;border-radius:12px;font-size:16px;outline:none}
  .search-box input:focus{border-color:#1db954}
  .search-box button{background:#1db954;border:0;padding:0 18px;border-radius:12px;font-weight:800;cursor:pointer}
  .tabs{display:flex;gap:8px;padding:0 16px 16px;overflow-x:auto}
  .tab{white-space:nowrap;background:#1a1a1a;border:1px solid #222;padding:8px 14px;border-radius:999px;font-size:14px;cursor:pointer}
  .tab.active{background:#fff;color:#000}
  .grid{padding:0 16px;display:grid;grid-template-columns:1fr 1fr;gap:12px}
  .card{background:#161616;border-radius:14px;overflow:hidden;cursor:pointer;border:1px solid #222}
  .card img{width:100%;aspect-ratio:16/9;object-fit:cover;display:block}
  .card-info{padding:10px}
  .card-info b{font-size:13px;display:block;line-height:1.3;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
  .card-info span{font-size:12px;color:#aaa}
  .card .add{margin-top:8px;width:100%;background:#222;color:#fff;border:0;padding:7px;border-radius:8px;cursor:pointer}
  .list{padding:0 16px;display:flex;flex-direction:column;gap:10px}
  .row{display:flex;gap:12px;background:#161616;padding:10px;border-radius:12px;align-items:center;cursor:pointer}
  .row img{width:72px;height:54px;object-fit:cover;border-radius:8px}
  .row b{font-size:14px;display:block;line-height:1.3}
  .row span{font-size:12px;color:#aaa}
  .row .del{margin-left:auto;background:#ff4444;border:0;color:#fff;padding:6px 10px;border-radius:8px;cursor:pointer}
  #player{position:fixed;left:0;right:0;bottom:0;background:#111;border-top:1px solid #222;padding:10px 14px 18px;z-index:20}
  #player-top{display:flex;gap:12px;align-items:center}
  #player-top img{width:56px;height:56px;border-radius:8px;object-fit:cover;background:#222}
  #player-info{flex:1;min-width:0}
  #player-info b{font-size:14px;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  #player-info span{font-size:12px;color:#aaa}
  #controls{display:flex;gap:14px;align-items:center;justify-content:center;margin-top:10px}
  #controls button{background:#fff;border:0;width:42px;height:42px;border-radius:50%;font-size:18px;cursor:pointer}
  #controls button.big{width:56px;height:56px;font-size:24px;background:#1db954}
  #progress{width:100%;margin-top:10px;accent-color:#1db954}
  #time{font-size:11px;color:#aaa;text-align:center;margin-top:4px}
  #yt-holder{position:absolute;width:1px;height:1px;overflow:hidden;opacity:0;pointer-events:none}
  .modal{position:fixed;inset:0;background:rgba(0,0,0,.8);display:none;align-items:center;justify-content:center;z-index:50;padding:20px}
  .modal.open{display:flex}
  .modal-box{background:#161616;width:100%;max-width:380px;padding:22px;border-radius:18px}
  .modal-box h2{margin-bottom:14px}
  .modal-box input{width:100%;background:#222;border:1px solid #333;color:#fff;padding:13px;border-radius:10px;margin-bottom:10px;font-size:16px}
  .modal-box .btn{width:100%;padding:13px;font-size:16px}
  .link{color:#1db954;text-align:center;margin-top:12px;font-size:14px;cursor:pointer}
  .empty{text-align:center;color:#777;padding:40px 20px}
  .hidden{display:none!important}
</style>
</head>
<body>

<header>
  <div class="logo">Wave<span>.</span></div>
  <div id="header-btns">
    <button class="btn" id="btn-login" onclick="abrirLogin()">Entrar</button>
    <button class="btn-outline hidden" id="btn-sair" onclick="sair()">Sair</button>
  </div>
</header>

<div class="search-box">
  <input id="busca" placeholder="Buscar música..." onkeydown="if(event.key==='Enter') buscar()">
  <button onclick="buscar()">Buscar</button>
</div>

<div class="tabs">
  <div class="tab active" id="tab-descobrir" onclick="mostrarAba('descobrir')">Descobrir</div>
  <div class="tab" id="tab-playlist" onclick="mostrarAba('playlist')">Minha Playlist</div>
</div>

<div id="aba-descobrir">
  <div class="grid" id="resultados"></div>
  <div class="empty" id="vazio-descobrir">Busque uma música acima para começar.<br><br>Ex: Matuê, Orochi, Trap, etc.</div>
</div>

<div id="aba-playlist" class="hidden">
  <div class="list" id="playlist"></div>
  <div class="empty" id="vazio-playlist">Sua playlist está vazia.<br>Toque em "+ Playlist" em uma música para salvar.</div>
</div>

<div id="player" class="hidden">
  <div id="player-top">
    <img id="p-thumb" src="">
    <div id="player-info"><b id="p-title">Nenhuma música</b><span id="p-channel"></span></div>
    <button class="btn-outline" onclick="minimizarPlayer()">—</button>
  </div>
  <input type="range" id="progress" value="0" min="0" max="100" oninput="seek(this.value)">
  <div id="time">0:00 / 0:00</div>
  <div id="controls">
    <button onclick="anterior()">⏮</button>
    <button class="big" id="btn-play" onclick="togglePlay()">▶</button>
    <button onclick="proxima()">⏭</button>
  </div>
  <div id="yt-holder"><div id="yt-player"></div></div>
</div>

<div class="modal" id="modal-login">
  <div class="modal-box">
    <h2 id="login-titulo">Entrar no Wave</h2>
    <input id="login-email" type="email" placeholder="Seu e-mail">
    <input id="login-senha" type="password" placeholder="Sua senha">
    <input id="login-nome" class="hidden" placeholder="Seu nome (só p/ criar conta)">
    <button class="btn" id="btn-entrar" onclick="fazerLogin()">Entrar</button>
    <div class="link" id="link-criar" onclick="alternarModo()">Não tenho conta, criar agora</div>
    <div class="link" id="link-voltar" onclick="fecharLogin()" style="color:#888">Fechar sem entrar</div>
    <div id="login-erro" style="color:#ff5555;font-size:13px;margin-top:10px;text-align:center"></div>
  </div>
</div>

<script src="https://www.youtube.com/iframe_api"></script>
<script>
const API_URL = 'https://waves.gt.tc';

let usuario = null;
let modoCriar = false;
let resultadosAtuais = [];
let playlistAtual = [];
let filaAtual = [];
let indiceAtual = 0;
let musicaAtual = null;
let ytPlayer = null;
let ytPronto = false;
let tocando = false;
let timerProgresso = null;

// ===== NORMALIZADOR - ACEITA QUALQUER FORMATO DO SERVIDOR =====
// Seu servidor manda: {videoId, title, channel, thumb}
// Outros mandam: {id, title, channelTitle, thumbnail}
// Isso unifica tudo para {id, title, channel, thumb}
function normalizar(m){
  if(!m) return null;
  if(typeof m === 'string') return {id:m, title:m, channel:'', thumb:''};
  const id = m.id || m.videoId || m.video_id || m.videoID || '';
  if(!id) return null;
  const thumb = m.thumb || m.thumbnail || m.thumbUrl || m.image || ('https://i.ytimg.com/vi/' + id + '/hqdefault.jpg');
  return {
    id: String(id),
    title: m.title || m.titulo || m.name || 'Sem título',
    channel: m.channel || m.channelTitle || m.canal || m.artist || '',
    thumb: thumb
  };
}
function normalizarLista(data){
  if(!data) return [];
  if(Array.isArray(data)) return data.map(normalizar).filter(Boolean);
  if(Array.isArray(data.results)) return data.results.map(normalizar).filter(Boolean);
  if(Array.isArray(data.playlist)) return data.playlist.map(normalizar).filter(Boolean);
  if(Array.isArray(data.data)) return data.data.map(normalizar).filter(Boolean);
  if(Array.isArray(data.items)) return data.items.map(normalizar).filter(Boolean);
  if(data.videoId || data.id) { const um = normalizar(data); return um ? [um] : []; }
  return [];
}
function esc(s){
  return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;');
}

// ===== SEGUNDO PLANO + TELA BLOQUEADA =====
async function ativarSegundoPlano(){
  try{
    if(window.Capacitor && window.Capacitor.Plugins && window.Capacitor.Plugins.BackgroundMode){
      await window.Capacitor.Plugins.BackgroundMode.enable();
    }
  }catch(e){}
}
function atualizarMediaSession(){
  if(!('mediaSession' in navigator) || !musicaAtual) return;
  try{
    navigator.mediaSession.metadata = new MediaMetadata({
      title: musicaAtual.title,
      artist: musicaAtual.channel,
      album: 'Wave',
      artwork: [{ src: musicaAtual.thumb, sizes: '512x512', type: 'image/jpeg' }]
    });
    navigator.mediaSession.setActionHandler('play', ()=>{ if(!tocando) togglePlay(); });
    navigator.mediaSession.setActionHandler('pause', ()=>{ if(tocando) togglePlay(); });
    navigator.mediaSession.setActionHandler('nexttrack', ()=> proxima());
    navigator.mediaSession.setActionHandler('previoustrack', ()=> anterior());
  }catch(e){}
}

// ===== LOGIN =====
function verificarLogin(){
  try{
    const salvo = localStorage.getItem('wave_user');
    if(salvo){
      usuario = JSON.parse(salvo);
      document.getElementById('btn-login').classList.add('hidden');
      document.getElementById('btn-sair').classList.remove('hidden');
      carregarPlaylist();
    }
  }catch(e){}
}
function abrirLogin(){ document.getElementById('modal-login').classList.add('open'); }
function fecharLogin(){ document.getElementById('modal-login').classList.remove('open'); }
function alternarModo(){
  modoCriar = !modoCriar;
  document.getElementById('login-nome').classList.toggle('hidden', !modoCriar);
  document.getElementById('login-titulo').textContent = modoCriar ? 'Criar conta' : 'Entrar no Wave';
  document.getElementById('btn-entrar').textContent = modoCriar ? 'Criar conta' : 'Entrar';
  document.getElementById('link-criar').textContent = modoCriar ? 'Já tenho conta, entrar' : 'Não tenho conta, criar agora';
  document.getElementById('login-erro').textContent = '';
}
async function fazerLogin(){
  const email = document.getElementById('login-email').value.trim();
  const senha = document.getElementById('login-senha').value;
  const nome = document.getElementById('login-nome').value.trim();
  const erroEl = document.getElementById('login-erro');
  if(!email || !senha){ erroEl.textContent='Preencha e-mail e senha'; return; }
  erroEl.textContent='Carregando...';
  document.getElementById('btn-entrar').disabled = true;
  try{
    const action = modoCriar ? 'register' : 'login';
    const r = await fetch(API_URL + '/?action=' + action, {
      method:'POST',
      headers:{'Content-Type':'application/x-www-form-urlencoded'},
      body: 'email='+encodeURIComponent(email)+'&senha='+encodeURIComponent(senha)+'&nome='+encodeURIComponent(nome)+'&name='+encodeURIComponent(nome)
    });
    const texto = await r.text();
    let data = {};
    try{ data = JSON.parse(texto); }catch(e){ data = {success:false, message:'Resposta inválida do servidor'}; }
    if(data.success || data.user || data.ok){
      usuario = data.user || {email, nome: nome || data.nome || email};
      if(!usuario.email) usuario.email = email;
      localStorage.setItem('wave_user', JSON.stringify(usuario));
      erroEl.textContent = '';
      fecharLogin();
      document.getElementById('btn-login').classList.add('hidden');
      document.getElementById('btn-sair').classList.remove('hidden');
      carregarPlaylist();
    } else {
      erroEl.textContent = data.message || data.error || 'E-mail ou senha incorretos';
    }
  }catch(e){
    erroEl.textContent='Erro de conexão com o servidor. Confira o CORS no index.php';
    console.log('LOGIN ERRO:', e);
  } finally {
    document.getElementById('btn-entrar').disabled = false;
  }
}
function sair(){
  usuario=null; localStorage.removeItem('wave_user');
  document.getElementById('btn-login').classList.remove('hidden');
  document.getElementById('btn-sair').classList.add('hidden');
  playlistAtual=[]; renderPlaylist();
}

// ===== BUSCA =====
async function buscar(){
  const q = document.getElementById('busca').value.trim();
  if(!q) return;
  mostrarAba('descobrir');
  document.getElementById('resultados').innerHTML='<div class="empty">Buscando...</div>';
  document.getElementById('vazio-descobrir').style.display='none';
  try{
    const r = await fetch(API_URL + '/?q=' + encodeURIComponent(q));
    const data = await r.json();
    resultadosAtuais = normalizarLista(data);
    renderResultados();
  }catch(e){
    document.getElementById('resultados').innerHTML='<div class="empty">Erro ao buscar. Confira se o API_URL está certo.</div>';
  }
}
function renderResultados(){
  const el = document.getElementById('resultados');
  document.getElementById('vazio-descobrir').style.display = resultadosAtuais.length ? 'none':'block';
  el.innerHTML='';
  resultadosAtuais.forEach((m,i)=>{
    const d=document.createElement('div'); d.className='card';
    d.innerHTML=`<img src="${esc(m.thumb)}" loading="lazy"><div class="card-info"><b>${esc(m.title)}</b><span>${esc(m.channel)}</span><button class="add" data-idx="${i}">+ Playlist</button></div>`;
    d.querySelector('.add').onclick = (e)=>{ e.stopPropagation(); salvarNaPlaylist(m.id); };
    d.onclick=()=> tocarMusica(m, resultadosAtuais, i);
    el.appendChild(d);
  });
}

// ===== PLAYLIST =====
async function carregarPlaylist(){
  if(!usuario) return;
  try{
    const r = await fetch(API_URL + '/?action=get_playlist&email=' + encodeURIComponent(usuario.email));
    const data = await r.json();
    playlistAtual = normalizarLista(data);
    renderPlaylist();
  }catch(e){}
}
function renderPlaylist(){
  const el=document.getElementById('playlist');
  document.getElementById('vazio-playlist').style.display = playlistAtual.length ? 'none':'block';
  el.innerHTML='';
  playlistAtual.forEach((m,i)=>{
    const d=document.createElement('div'); d.className='row';
    d.innerHTML=`<img src="${esc(m.thumb)}" loading="lazy"><div><b>${esc(m.title)}</b><span>${esc(m.channel)}</span></div><button class="del">X</button>`;
    d.querySelector('.del').onclick = (e)=>{ e.stopPropagation(); removerDaPlaylist(m.id); };
    d.onclick=()=> tocarMusica(m, playlistAtual, i);
    el.appendChild(d);
  });
}
async function salvarNaPlaylist(id){
  if(!usuario){ abrirLogin(); return; }
  const m = resultadosAtuais.find(x=>x.id===id) || playlistAtual.find(x=>x.id===id);
  if(!m) return;
  try{
    await fetch(API_URL + '/?action=add_playlist', {
      method:'POST',
      headers:{'Content-Type':'application/x-www-form-urlencoded'},
      body:'email='+encodeURIComponent(usuario.email)+'&id='+encodeURIComponent(m.id)+'&videoId='+encodeURIComponent(m.id)+'&title='+encodeURIComponent(m.title)+'&channel='+encodeURIComponent(m.channel)+'&thumb='+encodeURIComponent(m.thumb)
    });
    await carregarPlaylist();
    alert('Salvo na playlist!');
  }catch(e){ alert('Erro ao salvar'); }
}
async function removerDaPlaylist(id){
  if(!usuario) return;
  try{
    await fetch(API_URL + '/?action=remove_playlist', {
      method:'POST',
      headers:{'Content-Type':'application/x-www-form-urlencoded'},
      body:'email='+encodeURIComponent(usuario.email)+'&id='+encodeURIComponent(id)+'&videoId='+encodeURIComponent(id)
    });
    await carregarPlaylist();
  }catch(e){}
}

// ===== PLAYER =====
function onYouTubeIframeAPIReady(){
  ytPronto=true;
  ytPlayer = new YT.Player('yt-player', {
    height:'1', width:'1',
    playerVars:{ autoplay:0, controls:0, disablekb:1, playsinline:1 },
    events:{ onStateChange: onPlayerState, onError: onPlayerError }
  });
}
function onPlayerError(e){ console.log('YT Error', e.data); }
function onPlayerState(e){
  if(e.data===YT.PlayerState.ENDED) proxima();
  if(e.data===YT.PlayerState.PLAYING){ tocando=true; document.getElementById('btn-play').textContent='⏸'; iniciarProgresso(); }
  if(e.data===YT.PlayerState.PAUSED){ tocando=false; document.getElementById('btn-play').textContent='▶'; }
}
function tocarMusica(m, lista, idx){
  m = normalizar(m);
  if(!m) return;
  musicaAtual=m; filaAtual=lista; indiceAtual=idx;
  document.getElementById('player').classList.remove('hidden');
  document.getElementById('p-thumb').src=m.thumb;
  document.getElementById('p-title').textContent=m.title;
  document.getElementById('p-channel').textContent=m.channel;
  ativarSegundoPlano();
  atualizarMediaSession();
  if(ytPronto && ytPlayer && ytPlayer.loadVideoById){
    ytPlayer.loadVideoById(m.id);
  } else {
    setTimeout(()=>{ if(ytPlayer && ytPlayer.loadVideoById) ytPlayer.loadVideoById(m.id); }, 500);
  }
}
function togglePlay(){
  if(!ytPlayer) return;
  if(tocando) ytPlayer.pauseVideo(); else ytPlayer.playVideo();
}
function proxima(){
  if(!filaAtual.length) return;
  indiceAtual = (indiceAtual+1) % filaAtual.length;
  tocarMusica(filaAtual[indiceAtual], filaAtual, indiceAtual);
}
function anterior(){
  if(!filaAtual.length) return;
  indiceAtual = (indiceAtual-1+filaAtual.length) % filaAtual.length;
  tocarMusica(filaAtual[indiceAtual], filaAtual, indiceAtual);
}
function seek(v){
  if(!ytPlayer || !ytPlayer.getDuration) return;
  const dur = ytPlayer.getDuration();
  if(dur) ytPlayer.seekTo(dur * v / 100, true);
}
function iniciarProgresso(){
  clearInterval(timerProgresso);
  timerProgresso = setInterval(()=>{
    if(!ytPlayer || !ytPlayer.getCurrentTime) return;
    const cur = ytPlayer.getCurrentTime();
    const dur = ytPlayer.getDuration() || 0;
    if(dur>0){
      document.getElementById('progress').value = (cur/dur*100);
      document.getElementById('time').textContent = fmt(cur)+' / '+fmt(dur);
    }
  }, 500);
}
function fmt(s){ s=Math.floor(s); return Math.floor(s/60)+':'+String(s%60).padStart(2,'0'); }
function minimizarPlayer(){ document.getElementById('player').classList.add('hidden'); }
function mostrarAba(aba){
  document.getElementById('aba-descobrir').classList.toggle('hidden', aba!=='descobrir');
  document.getElementById('aba-playlist').classList.toggle('hidden', aba!=='playlist');
  document.getElementById('tab-descobrir').classList.toggle('active', aba==='descobrir');
  document.getElementById('tab-playlist').classList.toggle('active', aba==='playlist');
  if(aba==='playlist') carregarPlaylist();
}

verificarLogin();
</script>
</body>
</html>
