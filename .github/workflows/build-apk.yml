name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Instalar dependências
        run: npm install
      - name: Adicionar plataforma Android
        run: |
          rm -rf android
          npx cap add android
      - name: Sync Capacitor
        run: npx cap sync android
      - name: Segundo plano - WebView ativo + serviço em primeiro plano + MediaSession
        run: |
          python3 << 'PY'
          import pathlib
          p = pathlib.Path("android/app/src/main/AndroidManifest.xml")
          txt = p.read_text()
          anchor = '<uses-permission android:name="android.permission.INTERNET" />'
          assert anchor in txt, "ancora INTERNET nao encontrada"
          for perm in ["FOREGROUND_SERVICE", "FOREGROUND_SERVICE_MEDIA_PLAYBACK", "POST_NOTIFICATIONS", "WAKE_LOCK"]:
              if f'android.permission.{perm}"' not in txt:
                  txt = txt.replace(anchor, anchor + '\n    <uses-permission android:name="android.permission.' + perm + '" />', 1)
          if "WaveService" not in txt:
              txt = txt.replace("</application>", '    <service android:name=".WaveService" android:exported="false" android:foregroundServiceType="mediaPlayback" />\n    </application>', 1)
          p.write_text(txt)
          print("OK")
          PY

          cat > android/app/src/main/java/com/wave/app/KeepAliveWebView.java << 'JAVA'
          package com.wave.app;

          import android.content.Context;
          import android.view.View;
          import android.webkit.WebView;

          /**
           * WebView que nunca avisa a pagina que a janela ficou invisivel (tela bloqueada / app minimizado).
           * Sem isso o player do YouTube se pausa sozinho quando a pagina vira "hidden".
           */
          public class KeepAliveWebView extends WebView {
            public KeepAliveWebView(Context context) { super(context); }

            @Override
            protected void onWindowVisibilityChanged(int visibility) {
              super.onWindowVisibilityChanged(View.VISIBLE);
            }
          }
          JAVA

          cat > android/app/src/main/java/com/wave/app/WaveService.java << 'JAVA'
          package com.wave.app;

          import android.app.Notification;
          import android.app.NotificationChannel;
          import android.app.NotificationManager;
          import android.app.PendingIntent;
          import android.app.Service;
          import android.content.Context;
          import android.content.Intent;
          import android.graphics.Bitmap;
          import android.graphics.BitmapFactory;
          import android.media.session.MediaSession;
          import android.media.session.PlaybackState;
          import android.net.wifi.WifiManager;
          import android.os.Build;
          import android.os.Handler;
          import android.os.IBinder;
          import android.os.Looper;
          import android.os.PowerManager;
          import android.os.SystemClock;
          import java.net.URL;

          /**
           * Servico em primeiro plano + MediaSession.
           * O audio continua sendo do player do YouTube dentro do WebView; este servico:
           *  - mantem o app com prioridade alta (notificacao fixa) e CPU/Wi-Fi acordados;
           *  - mostra a notificacao e os controles da tela de bloqueio;
           *  - repassa os comandos (play, pause, proxima, anterior, seek) para o JavaScript.
           */
          public class WaveService extends Service {
            public interface Listener { void onCommand(String cmd); }

            public static final String CHANNEL = "wave_playback";
            private static final String A_START = "wave.START";
            private static final String A_CMD = "wave.CMD";
            private static final String A_STOP = "wave.STOP";

            public static volatile Listener listener;
            private static volatile WaveService inst;
            private static final Handler MAIN = new Handler(Looper.getMainLooper());

            // estado enviado pelo JavaScript
            private static volatile String sTitle = "";
            private static volatile String sArtist = "";
            private static volatile String sThumb = "";
            private static volatile boolean sPlaying = false;
            private static volatile long sPos = 0;
            private static volatile long sDur = 0;
            private static volatile long sStamp = 0;

            private MediaSession session;
            private PowerManager.WakeLock wakeLock;
            private WifiManager.WifiLock wifiLock;
            private Bitmap art;
            private String artUrl = "";

            // ---------- API estatica (chamada pela ponte JS) ----------

            public static void update(Context ctx, String title, String artist, String thumb, boolean playing, long pos, long dur) {
              sTitle = title == null ? "" : title;
              sArtist = artist == null ? "" : artist;
              sThumb = thumb == null ? "" : thumb;
              sPlaying = playing;
              sPos = Math.max(0, pos);
              sDur = Math.max(0, dur);
              sStamp = SystemClock.elapsedRealtime();
              final WaveService s = inst;
              if (s == null) {
                if (!playing) return;
                try {
                  Intent i = new Intent(ctx, WaveService.class);
                  i.setAction(A_START);
                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O) ctx.startForegroundService(i);
                  else ctx.startService(i);
                } catch (Exception e) {}
              } else {
                MAIN.post(new Runnable() { @Override public void run() { s.refresh(); } });
              }
            }

            public static void stop(Context ctx) {
              try { ctx.stopService(new Intent(ctx, WaveService.class)); } catch (Exception e) {}
            }

            private static void forward(String cmd) {
              Listener l = listener;
              if (l != null && cmd != null) l.onCommand(cmd);
            }

            // ---------- ciclo de vida ----------

            @Override public void onCreate() {
              super.onCreate();
              inst = this;
              PowerManager pm = (PowerManager) getSystemService(POWER_SERVICE);
              wakeLock = pm.newWakeLock(PowerManager.PARTIAL_WAKE_LOCK, "Wave::PlaybackLock");
              wakeLock.setReferenceCounted(false);
              try {
                WifiManager wm = (WifiManager) getApplicationContext().getSystemService(Context.WIFI_SERVICE);
                wifiLock = wm.createWifiLock(WifiManager.WIFI_MODE_FULL_HIGH_PERF, "Wave::WifiLock");
                wifiLock.setReferenceCounted(false);
              } catch (Exception e) {}

              session = new MediaSession(this, "Wave");
              session.setCallback(new MediaSession.Callback() {
                @Override public void onPlay() { sPlaying = true; refresh(); forward("play"); }
                @Override public void onPause() { sPlaying = false; refresh(); forward("pause"); }
                @Override public void onSkipToNext() { forward("next"); }
                @Override public void onSkipToPrevious() { forward("prev"); }
                @Override public void onSeekTo(long pos) { sPos = pos; sStamp = SystemClock.elapsedRealtime(); refresh(); forward("seek:" + pos); }
              });
              session.setActive(true);
            }

            @Override public int onStartCommand(Intent intent, int flags, int startId) {
              ensureForeground();
              String action = intent != null ? intent.getAction() : null;
              if (A_STOP.equals(action)) {
                forward("pause");
                stopForeground(true);
                stopSelf();
                return START_NOT_STICKY;
              }
              if (A_CMD.equals(action)) {
                String cmd = intent.getStringExtra("cmd");
                if ("toggle".equals(cmd)) {
                  sPlaying = !sPlaying;                 // resposta imediata na notificacao
                  sStamp = SystemClock.elapsedRealtime();
                  forward(sPlaying ? "play" : "pause");
                } else {
                  forward(cmd);
                }
              }
              refresh();
              return START_NOT_STICKY;
            }

            @Override public void onDestroy() {
              inst = null;
              try { if (session != null) { session.setActive(false); session.release(); } } catch (Exception e) {}
              releaseLocks();
              super.onDestroy();
            }

            @Override public IBinder onBind(Intent intent) { return null; }

            // ---------- sessao, notificacao e travas ----------

            private void refresh() {
              if (session == null) return;
              loadArtIfNeeded();
              android.media.MediaMetadata.Builder mb = new android.media.MediaMetadata.Builder()
                .putString(android.media.MediaMetadata.METADATA_KEY_TITLE, sTitle)
                .putString(android.media.MediaMetadata.METADATA_KEY_ARTIST, sArtist)
                .putLong(android.media.MediaMetadata.METADATA_KEY_DURATION, sDur);
              if (art != null) mb.putBitmap(android.media.MediaMetadata.METADATA_KEY_ALBUM_ART, art);
              session.setMetadata(mb.build());

              long actions = PlaybackState.ACTION_PLAY | PlaybackState.ACTION_PAUSE | PlaybackState.ACTION_PLAY_PAUSE
                | PlaybackState.ACTION_SKIP_TO_NEXT | PlaybackState.ACTION_SKIP_TO_PREVIOUS | PlaybackState.ACTION_SEEK_TO;
              session.setPlaybackState(new PlaybackState.Builder()
                .setActions(actions)
                .setState(sPlaying ? PlaybackState.STATE_PLAYING : PlaybackState.STATE_PAUSED, sPos, sPlaying ? 1f : 0f, sStamp)
                .build());

              try { startForeground(1, buildNotification()); } catch (Exception e) {}
              if (sPlaying) acquireLocks(); else releaseLocks();
            }

            private void loadArtIfNeeded() {
              final String url = sThumb;
              if (url.isEmpty() || url.equals(artUrl)) return;
              artUrl = url;
              art = null;
              new Thread(new Runnable() {
                @Override public void run() {
                  try {
                    final Bitmap bmp = BitmapFactory.decodeStream(new URL(url).openStream());
                    if (bmp == null) return;
                    MAIN.post(new Runnable() {
                      @Override public void run() {
                        if (!url.equals(artUrl)) return;
                        art = bmp;
                        refresh();
                      }
                    });
                  } catch (Exception e) {}
                }
              }).start();
            }

            private void acquireLocks() {
              try { if (wakeLock != null && !wakeLock.isHeld()) wakeLock.acquire(10 * 60 * 60 * 1000L); } catch (Exception e) {}
              try { if (wifiLock != null && !wifiLock.isHeld()) wifiLock.acquire(); } catch (Exception e) {}
            }

            private void releaseLocks() {
              try { if (wakeLock != null && wakeLock.isHeld()) wakeLock.release(); } catch (Exception e) {}
              try { if (wifiLock != null && wifiLock.isHeld()) wifiLock.release(); } catch (Exception e) {}
            }

            private PendingIntent actCmd(String cmd, int code) {
              Intent i = new Intent(this, WaveService.class);
              i.setAction(A_CMD);
              i.putExtra("cmd", cmd);
              return PendingIntent.getService(this, code, i, PendingIntent.FLAG_IMMUTABLE | PendingIntent.FLAG_UPDATE_CURRENT);
            }

            private PendingIntent actStop() {
              Intent i = new Intent(this, WaveService.class);
              i.setAction(A_STOP);
              return PendingIntent.getService(this, 4, i, PendingIntent.FLAG_IMMUTABLE | PendingIntent.FLAG_UPDATE_CURRENT);
            }

            private Notification buildNotification() {
              createChannel();
              Intent open = new Intent(this, MainActivity.class);
              open.setFlags(Intent.FLAG_ACTIVITY_SINGLE_TOP | Intent.FLAG_ACTIVITY_CLEAR_TOP);
              PendingIntent content = PendingIntent.getActivity(this, 0, open, PendingIntent.FLAG_IMMUTABLE | PendingIntent.FLAG_UPDATE_CURRENT);

              Notification.Builder b = Build.VERSION.SDK_INT >= Build.VERSION_CODES.O
                ? new Notification.Builder(this, CHANNEL) : new Notification.Builder(this);
              b.setContentTitle(sTitle.isEmpty() ? "Wave" : sTitle)
                .setContentText(sArtist)
                .setSmallIcon(android.R.drawable.ic_media_play)
                .setContentIntent(content)
                .setOnlyAlertOnce(true)
                .setVisibility(Notification.VISIBILITY_PUBLIC)
                .setOngoing(sPlaying)
                .addAction(android.R.drawable.ic_media_previous, "Anterior", actCmd("prev", 1))
                .addAction(sPlaying ? android.R.drawable.ic_media_pause : android.R.drawable.ic_media_play,
                           sPlaying ? "Pausar" : "Tocar", actCmd("toggle", 2))
                .addAction(android.R.drawable.ic_media_next, "Proxima", actCmd("next", 3))
                .addAction(android.R.drawable.ic_menu_close_clear_cancel, "Fechar", actStop())
                .setStyle(new Notification.MediaStyle()
                  .setMediaSession(session.getSessionToken())
                  .setShowActionsInCompactView(0, 1, 2));
              if (art != null) b.setLargeIcon(art);
              return b.build();
            }

            private void ensureForeground() {
              try { startForeground(1, buildNotification()); } catch (Exception e) {}
            }

            private void createChannel() {
              if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O) {
                NotificationChannel ch = new NotificationChannel(CHANNEL, "Wave Playback", NotificationManager.IMPORTANCE_LOW);
                NotificationManager nm = getSystemService(NotificationManager.class);
                if (nm != null) nm.createNotificationChannel(ch);
              }
            }
          }
          JAVA

          cat > android/app/src/main/java/com/wave/app/MainActivity.java << 'JAVA'
          package com.wave.app;

          import android.app.Activity;
          import android.content.Intent;
          import android.content.pm.PackageManager;
          import android.graphics.Color;
          import android.net.Uri;
          import android.os.Build;
          import android.os.Bundle;
          import android.view.WindowManager;
          import android.webkit.CookieManager;
          import android.webkit.JavascriptInterface;
          import android.webkit.ValueCallback;
          import android.webkit.WebChromeClient;
          import android.webkit.WebResourceRequest;
          import android.webkit.WebSettings;
          import android.webkit.WebView;
          import android.webkit.WebViewClient;
          import org.json.JSONObject;

          public class MainActivity extends Activity {
            private static final String SITE = "https://waves.gt.tc";
            private KeepAliveWebView web;

            @Override
            protected void onCreate(Bundle savedInstanceState) {
              try {
                int theme = getResources().getIdentifier("AppTheme_NoActionBar", "style", getPackageName());
                if (theme != 0) setTheme(theme);
              } catch (Exception e) {}
              super.onCreate(savedInstanceState);

              getWindow().setSoftInputMode(WindowManager.LayoutParams.SOFT_INPUT_ADJUST_RESIZE);
              int bg = Color.parseColor("#0b0b14");
              try { getWindow().setStatusBarColor(bg); getWindow().setNavigationBarColor(bg); } catch (Exception e) {}

              web = new KeepAliveWebView(this);
              web.setBackgroundColor(bg);
              web.setFitsSystemWindows(true);
              setContentView(web);

              WebSettings s = web.getSettings();
              s.setJavaScriptEnabled(true);
              s.setDomStorageEnabled(true);
              s.setMediaPlaybackRequiresUserGesture(false);
              s.setMixedContentMode(WebSettings.MIXED_CONTENT_ALWAYS_ALLOW);
              CookieManager cm = CookieManager.getInstance();
              cm.setAcceptCookie(true);
              cm.setAcceptThirdPartyCookies(web, true);
              // mantem o processo de renderizacao do WebView com prioridade alta mesmo em segundo plano
              if (Build.VERSION.SDK_INT >= 26) web.setRendererPriorityPolicy(WebView.RENDERER_PRIORITY_IMPORTANT, false);

              web.addJavascriptInterface(new WaveMedia(), "WaveMedia");
              web.setWebChromeClient(new WebChromeClient());
              web.setWebViewClient(new WebViewClient() {
                @Override
                public boolean shouldOverrideUrlLoading(WebView view, WebResourceRequest request) {
                  if (!request.isForMainFrame()) return false;
                  String host = request.getUrl().getHost();
                  if (host != null && (host.endsWith("gt.tc") || host.endsWith("youtube.com") || host.endsWith("google.com"))) return false;
                  try { startActivity(new Intent(Intent.ACTION_VIEW, request.getUrl())); } catch (Exception e) {}
                  return true;
                }
              });

              // comandos vindos da notificacao / tela de bloqueio / fone -> JavaScript
              WaveService.listener = new WaveService.Listener() {
                @Override public void onCommand(final String cmd) {
                  runOnUiThread(new Runnable() {
                    @Override public void run() {
                      try { web.evaluateJavascript("window.onMediaCmd&&window.onMediaCmd(" + JSONObject.quote(cmd) + ")", null); } catch (Exception e) {}
                    }
                  });
                }
              };

              try {
                if (Build.VERSION.SDK_INT >= 33
                    && checkSelfPermission(android.Manifest.permission.POST_NOTIFICATIONS) != PackageManager.PERMISSION_GRANTED) {
                  requestPermissions(new String[]{android.Manifest.permission.POST_NOTIFICATIONS}, 1);
                }
              } catch (Exception e) {}

              if (savedInstanceState != null) web.restoreState(savedInstanceState);
              else web.loadUrl(SITE);
            }

            @Override protected void onSaveInstanceState(Bundle out) {
              super.onSaveInstanceState(out);
              if (web != null) web.saveState(out);
            }

            // NUNCA chamamos web.onPause(): o WebView precisa continuar rodando em segundo plano.
            @Override protected void onResume() { super.onResume(); if (web != null) { web.onResume(); web.resumeTimers(); } }
            @Override protected void onPause() { super.onPause(); if (web != null) web.resumeTimers(); }
            @Override protected void onStop() { super.onStop(); if (web != null) web.resumeTimers(); }

            // Voltar: fecha o player grande se estiver aberto; senao so minimiza (a musica continua).
            @Override
            public void onBackPressed() {
              if (web == null) { super.onBackPressed(); return; }
              String js = "(function(){var f=document.getElementById('fullPlayer');if(f&&f.classList.contains('open')){try{fecharFullPlayer();}catch(e){}return 1;}return 0;})()";
              web.evaluateJavascript(js, new ValueCallback<String>() {
                @Override public void onReceiveValue(String v) { if (!"1".equals(v)) moveTaskToBack(true); }
              });
            }

            @Override
            protected void onDestroy() {
              WaveService.listener = null;
              WaveService.stop(this);
              if (web != null) { web.destroy(); web = null; }
              super.onDestroy();
            }

            // Ponte JS -> nativo: o JavaScript informa o que esta tocando; o servico mostra notificacao e controles.
            public class WaveMedia {
              @JavascriptInterface
              public void update(String title, String artist, String thumb, boolean playing, long posMs, long durMs) {
                WaveService.update(MainActivity.this, title, artist, thumb, playing, posMs, durMs);
              }
              @JavascriptInterface
              public void stop() { WaveService.stop(MainActivity.this); }
            }
          }
          JAVA

      - name: Build APK Debug
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace
      - name: Enviar APK
        uses: actions/upload-artifact@v4
        with:
          name: wave-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
