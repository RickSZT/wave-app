name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Instalar dependências
        run: npm install

      - name: Adicionar plataforma Android
        run: |
          rm -rf android
          npx cap add android

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Corrigir segundo plano - permissões + serviço + WebView
        run: |
          python3 << 'PY'
          import pathlib
          p = pathlib.Path("android/app/src/main/AndroidManifest.xml")
          txt = p.read_text()

          perms = [
              "FOREGROUND_SERVICE",
              "FOREGROUND_SERVICE_MEDIA_PLAYBACK",
              "FOREGROUND_SERVICE_DATA_SYNC",
              "POST_NOTIFICATIONS",
              "WAKE_LOCK",
              "RECEIVE_BOOT_COMPLETED",
          ]
          for perm in perms:
              tag = f'<uses-permission android:name="android.permission.{perm}" />'
              if perm not in txt:
                  txt = txt.replace(
                      '<uses-permission android:name="android.permission.INTERNET" />',
                      '<uses-permission android:name="android.permission.INTERNET" />\n    ' + tag,
                      1
                  )

          if "foregroundServiceType" not in txt:
              txt = txt.replace(
                  "<application",
                  '<application android:foregroundServiceType="mediaPlayback|dataSync"',
                  1
              )

          p.write_text(txt)
          print(txt)
          PY

          MAIN=android/app/src/main/java/com/wave/app/MainActivity.java
          cat > $MAIN << 'JAVA'
          package com.wave.app;

          import android.os.Bundle;
          import com.getcapacitor.BridgeActivity;

          public class MainActivity extends BridgeActivity {
            @Override
            protected void onCreate(Bundle savedInstanceState) {
              super.onCreate(savedInstanceState);
              try {
                if (bridge != null && bridge.getWebView() != null) {
                  bridge.getWebView().getSettings().setMediaPlaybackRequiresUserGesture(false);
                }
              } catch (Exception e) {}
            }

            @Override
            public void onPause() {
              try {
                if (bridge != null && bridge.getWebView() != null) {
                  bridge.getWebView().onPause();
                  bridge.getWebView().onResume();
                }
              } catch (Exception e) {}
            }

            @Override
            public void onResume() {
              super.onResume();
            }
          }
          JAVA

      - name: Build APK Debug
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace

      - name: Enviar APK
        uses: actions/upload-artifact@v4
        with:
          name: wave-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
