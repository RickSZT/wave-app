name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Instalar dependências
        run: npm install

      - name: Adicionar plataforma Android
        run: |
          rm -rf android
          npx cap add android

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Corrigir segundo plano - permissões + serviço + WebView
        run: |
          MANIFEST=android/app/src/main/AndroidManifest.xml

          grep -q "FOREGROUND_SERVICE\"" $MANIFEST || sed -i 's|<uses-permission android:name="android.permission.INTERNET" />|<uses-permission android:name="android.permission.INTERNET" />\n    <uses-permission android:name="android.permission.FOREGROUND_SERVICE" />\n    <uses-permission android:name="android.permission.FOREGROUND_SERVICE_MEDIA_PLAYBACK" />\n    <uses-permission android:name="android.permission.FOREGROUND_SERVICE_DATA_SYNC" />\n    <uses-permission android:name="android.permission.POST_NOTIFICATIONS" />\n    <uses-permission android:name="android.permission.WAKE_LOCK" />\n    <uses-permission android:name="android.permission.RECEIVE_BOOT_COMPLETED" />|' $MANIFEST

          grep -q "foregroundServiceType" $MANIFEST || sed -i 's|<application|<application android:foregroundServiceType="mediaPlayback|dataSync"|' $MANIFEST

          MAIN=android/app/src/main/java/com/wave/app/MainActivity.java
          cat > $MAIN << 'JAVA'
          package com.wave.app;

          import android.os.Bundle;
          import com.getcapacitor.BridgeActivity;

          public class MainActivity extends BridgeActivity {
            @Override
            protected void onCreate(Bundle savedInstanceState) {
              super.onCreate(savedInstanceState);
              try {
                if (bridge != null && bridge.getWebView() != null) {
                  bridge.getWebView().getSettings().setMediaPlaybackRequiresUserGesture(false);
                }
              } catch (Exception e) {}
            }

            @Override
            protected void onPause() {
              try {
                if (bridge != null && bridge.getWebView() != null) {
                  bridge.getWebView().onPause();
                  bridge.getWebView().onResume();
                }
              } catch (Exception e) {}
            }

            @Override
            protected void onResume() {
              super.onResume();
            }
          }
          JAVA

          echo "--- AndroidManifest.xml ---"
          cat $MANIFEST

      - name: Build APK Debug
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace

      - name: Enviar APK
        uses: actions/upload-artifact@v4
        with:
          name: wave-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
