name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Instalar dependências
        run: npm install

      - name: Adicionar plataforma Android
        run: |
          rm -rf android
          npx cap add android

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Corrigir segundo plano - Foreground Service + WebView
        run: |
          python3 << 'PY'
          import pathlib
          p = pathlib.Path("android/app/src/main/AndroidManifest.xml")
          txt = p.read_text()
          perms = [
              "FOREGROUND_SERVICE",
              "FOREGROUND_SERVICE_MEDIA_PLAYBACK",
              "FOREGROUND_SERVICE_DATA_SYNC",
              "POST_NOTIFICATIONS",
              "WAKE_LOCK",
              "RECEIVE_BOOT_COMPLETED",
          ]
          for perm in perms:
              tag = f'<uses-permission android:name="android.permission.{perm}" />'
              if perm not in txt:
                  txt = txt.replace(
                      '<uses-permission android:name="android.permission.INTERNET" />',
                      '<uses-permission android:name="android.permission.INTERNET" />\n    ' + tag,
                      1
                  )
          if "foregroundServiceType" not in txt:
              txt = txt.replace("<application", '<application android:foregroundServiceType="mediaPlayback|dataSync"', 1)
          if "WaveService" not in txt:
              txt = txt.replace(
                  "</application>",
                  '        <service android:name=".WaveService" android:exported="false" android:foregroundServiceType="mediaPlayback|dataSync" />\n    </application>',
                  1
              )
          p.write_text(txt)
          print(txt)
          PY

          cat > android/app/src/main/java/com/wave/app/WaveService.java << 'JAVA'
          package com.wave.app;

          import android.app.Notification;
          import android.app.NotificationChannel;
          import android.app.NotificationManager;
          import android.app.PendingIntent;
          import android.app.Service;
          import android.content.Intent;
          import android.os.Build;
          import android.os.IBinder;
          import android.os.PowerManager;

          public class WaveService extends Service {
            private PowerManager.WakeLock wakeLock;
            public static final String CHANNEL = "wave_playback";

            @Override
            public void onCreate() {
              super.onCreate();
              PowerManager pm = (PowerManager) getSystemService(POWER_SERVICE);
              wakeLock = pm.newWakeLock(PowerManager.PARTIAL_WAKE_LOCK, "Wave::PlaybackLock");
              wakeLock.setReferenceCounted(false);
            }

            @Override
            public int onStartCommand(Intent intent, int flags, int startId) {
              createChannel();
              Intent ni = new Intent(this, MainActivity.class);
              PendingIntent pi = PendingIntent.getActivity(this, 0, ni, PendingIntent.FLAG_IMMUTABLE | PendingIntent.FLAG_UPDATE_CURRENT);
              Notification.Builder b;
              if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O) {
                b = new Notification.Builder(this, CHANNEL);
              } else {
                b = new Notification.Builder(this);
              }
              Notification n = b
                .setContentTitle("Wave tocando")
                .setContentText("Sua música continua tocando")
                .setSmallIcon(android.R.drawable.ic_media_play)
                .setContentIntent(pi)
                .setOngoing(true)
                .build();
              startForeground(1, n);
              if (wakeLock != null && !wakeLock.isHeld()) wakeLock.acquire(10*60*1000L);
              return START_STICKY;
            }

            private void createChannel() {
              if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O) {
                NotificationChannel ch = new NotificationChannel(CHANNEL, "Wave Playback", NotificationManager.IMPORTANCE_LOW);
                ch.setDescription("Mantém a música tocando em segundo plano");
                NotificationManager nm = getSystemService(NotificationManager.class);
                if (nm != null) nm.createNotificationChannel(ch);
              }
            }

            @Override
            public void onDestroy() {
              if (wakeLock != null && wakeLock.isHeld()) wakeLock.release();
              super.onDestroy();
            }

            @Override
            public IBinder onBind(Intent intent) { return null; }
          }
          JAVA

          cat > android/app/src/main/java/com/wave/app/MainActivity.java << 'JAVA'
          package com.wave.app;

          import android.content.Intent;
          import android.os.Build;
          import android.os.Bundle;
          import com.getcapacitor.BridgeActivity;

          public class MainActivity extends BridgeActivity {
            private boolean serviceStarted = false;

            @Override
            protected void onCreate(Bundle savedInstanceState) {
              super.onCreate(savedInstanceState);
              try {
                if (bridge != null && bridge.getWebView() != null) {
                  bridge.getWebView().getSettings().setMediaPlaybackRequiresUserGesture(false);
                }
              } catch (Exception e) {}
            }

            private void startWaveService() {
              if (serviceStarted) return;
              try {
                Intent i = new Intent(this, WaveService.class);
                if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O) {
                  startForegroundService(i);
                } else {
                  startService(i);
                }
                serviceStarted = true;
              } catch (Exception e) {}
            }

            private void stopWaveService() {
              if (!serviceStarted) return;
              try {
                stopService(new Intent(this, WaveService.class));
                serviceStarted = false;
              } catch (Exception e) {}
            }

            @Override
            public void onPause() {
              super.onPause();
              startWaveService();
              try {
                if (bridge != null && bridge.getWebView() != null) {
                  bridge.getWebView().onResume();
                }
              } catch (Exception e) {}
            }

            @Override
            public void onResume() {
              super.onResume();
            }

            @Override
            public void onStop() {
              super.onStop();
              startWaveService();
              try {
                if (bridge != null && bridge.getWebView() != null) {
                  bridge.getWebView().onResume();
                }
              } catch (Exception e) {}
            }

            @Override
            public void onDestroy() {
              stopWaveService();
              super.onDestroy();
            }
          }
          JAVA

      - name: Build APK Debug
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace

      - name: Enviar APK
        uses: actions/upload-artifact@v4
        with:
          name: wave-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
