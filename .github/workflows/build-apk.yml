name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Instalar dependências
        run: npm install
      - name: Adicionar plataforma Android
        run: |
          rm -rf android
          npx cap add android
      - name: Sync Capacitor
        run: npx cap sync android
      - name: Player nativo - ExoPlayer + serviço de áudio
        run: |
          python3 << 'PY'
          import pathlib
          # 1. Manifest - permissões + serviço
          p = pathlib.Path("android/app/src/main/AndroidManifest.xml")
          txt = p.read_text()
          for perm in ["FOREGROUND_SERVICE","FOREGROUND_SERVICE_MEDIA_PLAYBACK","FOREGROUND_SERVICE_DATA_SYNC","POST_NOTIFICATIONS","WAKE_LOCK","RECEIVE_BOOT_COMPLETED"]:
              tag = f'<uses-permission android:name="android.permission.{perm}" />'
              if perm not in txt:
                  txt = txt.replace('<uses-permission android:name="android.permission.INTERNET" />', '<uses-permission android:name="android.permission.INTERNET" />\n    ' + tag, 1)
          if "foregroundServiceType" not in txt:
              txt = txt.replace("<application", '<application android:foregroundServiceType="mediaPlayback|dataSync"', 1)
          if "WaveService" not in txt:
              txt = txt.replace("</application>", '        <service android:name=".WaveService" android:exported="false" android:foregroundServiceType="mediaPlayback|dataSync" />\n    </application>', 1)
          p.write_text(txt)
          # 2. Gradle - ExoPlayer
          g = pathlib.Path("android/app/build.gradle")
          gt = g.read_text()
          if "exoplayer" not in gt.lower():
              gt = gt.replace("dependencies {", "dependencies {\n    implementation 'androidx.media3:media3-exoplayer:1.3.1'\n    implementation 'androidx.media3:media3-session:1.3.1'", 1)
              g.write_text(gt)
          print("OK")
          PY

          # 3. Serviço que TOCA DE VERDADE - fora do WebView
          cat > android/app/src/main/java/com/wave/app/WaveService.java << 'JAVA'
          package com.wave.app;

          import android.app.Notification;
          import android.app.NotificationChannel;
          import android.app.NotificationManager;
          import android.app.PendingIntent;
          import android.app.Service;
          import android.content.Intent;
          import android.os.Build;
          import android.os.IBinder;
          import android.os.PowerManager;
          import androidx.media3.common.MediaItem;
          import androidx.media3.exoplayer.ExoPlayer;
          import org.json.JSONArray;
          import org.json.JSONObject;
          import java.io.BufferedReader;
          import java.io.InputStreamReader;
          import java.net.HttpURLConnection;
          import java.net.URL;

          public class WaveService extends Service {
            public static ExoPlayer player;
            public static String currentId = "";
            public static String currentTitle = "";
            public static String currentChannel = "";
            private PowerManager.WakeLock wakeLock;
            public static final String CHANNEL = "wave_playback";

            @Override public void onCreate() {
              super.onCreate();
              PowerManager pm = (PowerManager) getSystemService(POWER_SERVICE);
              wakeLock = pm.newWakeLock(PowerManager.PARTIAL_WAKE_LOCK, "Wave::PlaybackLock");
              wakeLock.setReferenceCounted(false);
              if (player == null) {
                player = new ExoPlayer.Builder(this).build();
                player.setWakeMode(androidx.media3.common.C.WAKE_MODE_NETWORK);
              }
            }

            public static void playId(android.content.Context ctx, String videoId, String title, String channel) {
              Intent i = new Intent(ctx, WaveService.class);
              i.putExtra("videoId", videoId);
              i.putExtra("title", title);
              i.putExtra("channel", channel);
              if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O) ctx.startForegroundService(i);
              else ctx.startService(i);
            }

            @Override public int onStartCommand(Intent intent, int flags, int startId) {
              if (intent != null && intent.hasExtra("videoId")) {
                String vid = intent.getStringExtra("videoId");
                currentId = vid;
                currentTitle = intent.getStringExtra("title");
                currentChannel = intent.getStringExtra("channel");
                startForegroundWith(currentTitle);
                fetchAndPlay(vid);
              } else {
                startForegroundWith(currentTitle);
              }
              return START_STICKY;
            }

            private void startForegroundWith(String title) {
              createChannel();
              Intent ni = new Intent(this, MainActivity.class);
              PendingIntent pi = PendingIntent.getActivity(this, 0, ni, PendingIntent.FLAG_IMMUTABLE | PendingIntent.FLAG_UPDATE_CURRENT);
              Notification.Builder b = Build.VERSION.SDK_INT >= Build.VERSION_CODES.O ? new Notification.Builder(this, CHANNEL) : new Notification.Builder(this);
              Notification n = b.setContentTitle(title == null || title.isEmpty() ? "Wave tocando" : title)
                .setContentText(currentChannel == null ? "Wave" : currentChannel)
                .setSmallIcon(android.R.drawable.ic_media_play)
                .setContentIntent(pi).setOngoing(true).build();
              startForeground(1, n);
              if (wakeLock != null && !wakeLock.isHeld()) wakeLock.acquire(10*60*60*1000L);
            }

            private void fetchAndPlay(String vid) {
              new Thread(() -> {
                String audioUrl = null;
                // Tenta Piped - retorna audioStreams sem precisar de API key
                String[] endpoints = {
                  "https://pipedapi.kavin.rocks/streams/" + vid,
                  "https://pipedapi.adminforge.de/streams/" + vid,
                  "https://pipedapi.leptons.xyz/streams/" + vid
                };
                for (String ep : endpoints) {
                  try {
                    HttpURLConnection c = (HttpURLConnection) new URL(ep).openConnection();
                    c.setConnectTimeout(8000); c.setReadTimeout(8000);
                    BufferedReader r = new BufferedReader(new InputStreamReader(c.getInputStream()));
                    StringBuilder sb = new StringBuilder(); String line;
                    while ((line = r.readLine()) != null) sb.append(line);
                    JSONObject j = new JSONObject(sb.toString());
                    JSONArray arr = j.getJSONArray("audioStreams");
                    // Pega o melhor áudio - opus ou m4a
                    for (int k = 0; k < arr.length(); k++) {
                      JSONObject a = arr.getJSONObject(k);
                      if (a.has("url")) { audioUrl = a.getString("url"); break; }
                    }
                    if (audioUrl != null) break;
                  } catch (Exception e) {}
                }
                if (audioUrl != null && player != null) {
                  String url = audioUrl;
                  new android.os.Handler(android.os.Looper.getMainLooper()).post(() -> {
                    player.setMediaItem(MediaItem.fromUri(url));
                    player.prepare();
                    player.play();
                  });
                }
              }).start();
            }

            private void createChannel() {
              if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O) {
                NotificationChannel ch = new NotificationChannel(CHANNEL, "Wave Playback", NotificationManager.IMPORTANCE_LOW);
                NotificationManager nm = getSystemService(NotificationManager.class);
                if (nm != null) nm.createNotificationChannel(ch);
              }
            }
            @Override public void onDestroy() {
              if (wakeLock != null && wakeLock.isHeld()) wakeLock.release();
              super.onDestroy();
            }
            @Override public IBinder onBind(Intent intent) { return null; }
          }
          JAVA

          # 4. MainActivity - expõe WaveAudio pro JS e NÃO pausa o WebView no onStop
          cat > android/app/src/main/java/com/wave/app/MainActivity.java << 'JAVA'
          package com.wave.app;

          import android.os.Bundle;
          import android.webkit.JavascriptInterface;
          import com.getcapacitor.BridgeActivity;

          public class MainActivity extends BridgeActivity {
            @Override
            protected void onCreate(Bundle savedInstanceState) {
              super.onCreate(savedInstanceState);
              try {
                if (bridge != null && bridge.getWebView() != null) {
                  bridge.getWebView().getSettings().setMediaPlaybackRequiresUserGesture(false);
                  bridge.getWebView().addJavascriptInterface(new WaveAudio(), "WaveAudio");
                }
              } catch (Exception e) {}
            }
            public class WaveAudio {
              @JavascriptInterface public void play(String videoId, String title, String channel) {
                WaveService.playId(MainActivity.this, videoId, title, channel);
              }
              @JavascriptInterface public void pause() { if (WaveService.player != null) WaveService.player.pause(); }
              @JavascriptInterface public void resume() { if (WaveService.player != null) WaveService.player.play(); }
              @JavascriptInterface public void toggle() {
                if (WaveService.player == null) return;
                if (WaveService.player.isPlaying()) WaveService.player.pause(); else WaveService.player.play();
              }
              @JavascriptInterface public void seekTo(long ms) { if (WaveService.player != null) WaveService.player.seekTo(ms); }
              @JavascriptInterface public long getPosition() { return WaveService.player != null ? WaveService.player.getCurrentPosition() : 0; }
              @JavascriptInterface public long getDuration() { return WaveService.player != null && WaveService.player.getDuration() > 0 ? WaveService.player.getDuration() : 0; }
              @JavascriptInterface public boolean isPlaying() { return WaveService.player != null && WaveService.player.isPlaying(); }
              @JavascriptInterface public void setVolume(float v) { if (WaveService.player != null) WaveService.player.setVolume(v); }
            }
            @Override public void onPause() { super.onPause(); }
            @Override public void onResume() { super.onResume(); }
            @Override public void onStop() { super.onStop(); }
          }
          JAVA

      - name: Build APK Debug
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace
      - name: Enviar APK
        uses: actions/upload-artifact@v4
        with:
          name: wave-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
